<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="Task 0 - Simple Contact Form.css"> 
        <title>Part 1</title>
    </head>
    <body>
        <form>
            <label for="name">Name</label><br>
            <input type="text" id="name" name="name" required maxlength="20" minlength="2"><br>
            
            <label for="email">Email</label><br>
            <input type="email" id="email" name="email" required><br>
            
            <label for="message">Message</label><br>
            <textarea id="message" name="message" required maxlength="500" minlength="10"></textarea><br>
            
            <button type="submit">Submit</button>
        </form>
    </body>
    </html>
