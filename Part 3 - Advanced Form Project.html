<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Part 3</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body class="p-4">
        <form class="contactForm">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="fname" class="form-label d-block">First name</label>
                    <input type="text" id="fname" name="fname" required maxlength="20" minlength="2"
                    placeholder="Enter your last name"
                    class="form-control is-valid"
                    class="form-control is-invalid">

                    <div class="valid-feedback">Beautiful name!</div>
                    <div class="invalid-feedback">Are you sure?</div>

                </div>
                
                <div class="col-md-6 mb-3">
                    <label for="lname" class="form-label d-block">Last name</label>
                    <input type="text" id="lname" name="lname" required maxlength="20" minlength="2"
                    placeholder="Enter your last name"
                    class="form-control is-valid"
                    class="form-control is-invalid">

                    <div class="valid-feedback">Beautiful name!</div>
                    <div class="invalid-feedback">Are you sure?</div>

                </div>

                <div class="col-md-12 mb-3">
                    <label for="email" class="form-label d-block">E-mail</label>
                    <input type="email" id="email" name="email" required minlength="10"
                    placeholder="Your e-mail" 
                    class="form-control is-invalid" 
                    class="form-control is-valid">

                    <div class="valid-feedback">Cool!</div>
                    <div class="invalid-feedback">Is it even an e-mail?</div>

                </div>
                
                <div class="col-md-6 mb-3">
                    <label for="pwrd" class="form-label d-block">Password</label>
                    <input type="password" id="pwrd" name="pwrd" required minlength="8"
                    placeholder="Come up with your password"
                    class="form-control is-invalid" 
                    class="form-control is-valid">

                    <div class="valid-feedback">Great!</div>
                    <div class="invalid-feedback">Invalid password...</div>

                </div>

                <div class="col-md-6 mb-3">
                    <label for="conf-pwrd" class="form-label d-block">Confirm Password</label>
                    <input type="password" id="conf-pwrd" name="conf-pwrd" required minlength="8"
                    placeholder="Repeat your password"
                    class="form-control is-invalid" 
                    class="form-control is-valid">

                    <div class="valid-feedback">Great!</div>
                    <div class="invalid-feedback">Doesn't match... Try again!</div>                    

                </div>

                <div class="col-md-6 mb-3">
                    <p>Your gender:</p>

                    <label for="male">Male</label>
                    <input type="radio" id="male" name="gender" value="male">

                    <label for="female">Female</label>
                    <input type="radio" id="female" name="gender" value="female">            
                </div>

                <div class="col-md-12 mb-3">
                    <fieldset>
                        <p>Choose your hobbies:</p>

                        <input type="checkbox" id="reading" name="hobbies" value="reading">
                        <label for="reading">Reading</label>

                        <input type="checkbox" id="music" name="hobbies" value="music">
                        <label for="music">Music</label>

                        <input type="checkbox" id="sports" name="hobbies" value="sports">
                        <label for="sports">Sports</label>
                    </fieldset>
                </div>

                <div class="col-md-12 mb-3">
                <label for="country" class="form-label d-block">Choose your country:</label>
                <select id="country" name="country" required>
                    <option value="" selected disabled>Select your country</option>
                    <option value="kazakhstan">Kazakhstan</option>
                    <option value="uzb">Uzbekistan</option>
                    <option value="kyr">Kyrgyzstan</option>
                    <option value="other">Other</option>
                </select>
                </div>
            </div>
            <div class="d-flex justify-content-center gap-3">
                <button type="submit" class="btn btn-primary text-center">Submit</button>
                <button type="reset" class="btn btn-secondary text-center">Reset</button>            
            </div>

        </form>
    </body>
</html>
