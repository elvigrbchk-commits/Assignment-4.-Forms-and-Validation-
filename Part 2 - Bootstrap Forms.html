<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Part 2</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body class="p-4">
        <form class="contactForm">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label for="name" class="form-label d-block">Name</label>
                    <input type="text" id="name" name="name" required maxlength="20" minlength="2" 
                    placeholder="Your name" 
                    class="form-control is-valid"
                    class="form-control is-invalid">

                    <div class="valid-feedback">Beautiful name!</div>
                    <div class="invalid-feedback">Are you sure?</div>
                    
                </div>

                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label d-block">E-mail</label>
                    <input type="email" id="email" name="email" required minlength="10"
                    placeholder="Your e-mail" 
                    class="form-control is-invalid" 
                    class="form-control is-valid">
                    
                    <div class="valid-feedback">Cool!</div>
                    <div class="invalid-feedback">Is it even an e-mail?</div>
                    
                    <div class="form-text">Your personal data is safe</div>
                </div>

            </div>

                <div class="col-md-12 mb-3">
                    <label for="message" class="form-label d-block">Message</label>
                    <textarea id="message" name="message" required maxlength="500" minlength="10" 
                    class="form-control is-valid"
                    class="form-control is-invalid"
                    placeholder="Write something interesting about yourself"></textarea>
                    
                    <div class="valid-feedback">Great! Thanks for sharing!</div>
                    <div class="invalid-feedback">Oh, looks too short...</div>                
                
                </div>
            
            <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-secondary text-center">Submit</button>
            </div>

        </form>
    </body>
</html>
